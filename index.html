<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ты бы дошёл? · Интерактивный симулятор</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/styles.css?v=5.5">
  <link rel="stylesheet" href="./css/components.css?v=5.5">
  <link rel="stylesheet" href="./css/animations.css?v=5.5">

  <!-- Гарантированные инлайн-стили темы Codex (защита от кэша и перебивания темой Telegram) -->
  <style>
    :root {
      --color-bg: #0f1015 !important;
      --color-card-bg: #171821 !important;
      --color-text-main: #f8f7f3 !important;
      --color-text-muted: #9a9895 !important;
      --color-accent: #ff5c35 !important;
      --color-accent-2: #ffc857 !important;
      --color-accent-hover: #ff7452 !important;
      --color-border: rgba(255, 255, 255, 0.08) !important;
    }
    body, html, #app {
      background-color: #0f1015 !important;
      color: #f8f7f3 !important;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    .hud, .option-card, .metric-card, .tip-item, .drawer-panel {
      background: #171821 !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
      color: #f8f7f3 !important;
    }
    .primary-btn {
      background: #ff5c35 !important;
      color: #ffffff !important;
    }
    .primary-btn:hover, .primary-btn:active {
      background: #ff7452 !important;
    }
    .secondary-btn {
      background: #171821 !important;
      color: #f8f7f3 !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }
    .eyebrow {
      color: #ffc857 !important;
    }
    .text-muted, .muted {
      color: #9a9895 !important;
    }
    .metric-value {
      color: #f8f7f3 !important;
    }
    .option-card.option-selected {
      border-color: #ff5c35 !important;
      background: rgba(255, 92, 53, 0.12) !important;
    }
    .option-card.option-hidden {
      opacity: 0 !important;
      max-height: 0 !important;
      min-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border-width: 0 !important;
      pointer-events: none !important;
      overflow: hidden !important;
    }
    .choice-feedback.hidden {
      display: none !important;
    }
    .option-icon {
      background: rgba(255, 200, 87, 0.12) !important;
      color: #ffc857 !important;
    }
    .option-copy {
      color: #f8f7f3 !important;
    }
  </style>
  
  <!-- Notibot Bridge SDK -->
  <script src="./js/notibot-bridge.js?v=5.5"></script>
  <!-- Lucide Icons -->
  <script src="./js/vendor-lucide.js?v=5.5"></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div id="app"></div>

  <script type="module" src="./js/app.js?v=5.5"></script>
</body>
</html>
